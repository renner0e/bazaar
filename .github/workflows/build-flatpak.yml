on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/*"
      - "screenshots/*"
      - "translators.sh"
      - ".github/ISSUE_TEMPLATE/**"

env:
  NAME: bazaar
  ID: io.github.kolunmi.Bazaar
  MANIFEST_PATH: build-aux/flatpak/io.github.kolunmi.Bazaar.json
  # set by the flatpak-github-actions
  FLATPAK_BUILD_REPO: repo
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

name: CI Build Flatpak
jobs:

  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-latest
          # no latest for ARM :(
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: recursive
    - uses: flatpak/flatpak-github-actions/flatpak-builder@92ae9851ad316786193b1fd3f40c4b51eb5cb101 # v6.6
      with:
        bundle: ${{ env.NAME }}.flatpak
        manifest-path: ${{ env.MANIFEST_PATH }}
        cache-key: flatpak-builder-046f9ec
        arch: ${{ matrix.variant.arch }}
        verbose: true

    - uses: flatpak/flatpak-github-actions/flat-manager@v6
      name: "Deploy"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ env.NAME }}-ci
        flat-manager-url: https://renner0e.github.io/bazaar
        token: ${{ env.GH_TOKEN }}
